name: Amazon rank snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/collect-amazon-ranks.mjs
      - package.json
      - package-lock.json
      - .github/workflows/amazon-rank-snapshot.yml
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
concurrency:
  group: amazon-rank-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run collect:amazon-catalog
      - run: npm run collect:amazon-ranks
      - run: npm run build:amazon-node-catalog
      - run: npm run collect:amazon-keyword-ranks
      - name: Commit latest snapshot
        run: |
          git config user.name "amazon-rank-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/data/amazon-search-catalog.json dist/data/amazon-catalog.json dist/data/amazon-keyword-ranks.json dist/data/amazon-ranks.json
          git diff --cached --quiet || git commit -m "Update Amazon rank snapshot"
          git push
